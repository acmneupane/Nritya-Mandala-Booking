# Mobile app builds (Capacitor). The website itself is still deployed by Render
# and never reads this file or the android/ folder.
#
# No `triggering` section: builds only run when started manually from the
# Codemagic dashboard, so pushes to main don't use build minutes.
workflows:
  android-debug:
    name: Android test APK (unsigned debug build)
    # mac_mini_m2 is the machine included in Codemagic's free tier; it has the
    # Android SDK installed, so it builds Android as well as iOS.
    instance_type: mac_mini_m2
    max_build_duration: 30
    environment:
      # VITE_SUPABASE_URL and VITE_SUPABASE_ANON_KEY, same values as Render's
      # environment settings. Vite bakes them into the build; without them the
      # app crashes on launch (white screen).
      groups:
        - supabase
      node: 22
      java: 21
    scripts:
      - name: Check Supabase settings are present
        script: |
          if [ -z "$VITE_SUPABASE_URL" ] || [ -z "$VITE_SUPABASE_ANON_KEY" ]; then
            echo "VITE_SUPABASE_URL / VITE_SUPABASE_ANON_KEY are missing. Add them to the 'supabase' environment variable group in Codemagic."
            exit 1
          fi
      - name: Install dependencies
        script: npm ci
      - name: Build web app
        script: npm run build
      - name: Copy web build into the Android project
        script: npx cap sync android
      - name: Point Gradle at the Android SDK
        script: echo "sdk.dir=$ANDROID_SDK_ROOT" > "$CM_BUILD_DIR/android/local.properties"
      - name: Build debug APK
        script: |
          cd android
          ./gradlew assembleDebug
    artifacts:
      - android/app/build/outputs/apk/debug/*.apk

  ios-simulator:
    name: iOS simulator build (unsigned, checks the app compiles)
    # Runs without an Apple Developer account: builds for the iOS Simulator
    # only, so it can't be installed on a real iPhone. Real-device builds
    # (TestFlight) need the Apple Developer Program and signing, added later.
    instance_type: mac_mini_m2
    max_build_duration: 30
    environment:
      groups:
        - supabase
      node: 22
      xcode: latest
    scripts:
      - name: Check Supabase settings are present
        script: |
          if [ -z "$VITE_SUPABASE_URL" ] || [ -z "$VITE_SUPABASE_ANON_KEY" ]; then
            echo "VITE_SUPABASE_URL / VITE_SUPABASE_ANON_KEY are missing. Add them to the 'supabase' environment variable group in Codemagic."
            exit 1
          fi
      - name: Install dependencies
        script: npm ci
      - name: Build web app
        script: npm run build
      - name: Copy web build into the iOS project
        script: npx cap sync ios
      - name: Build for the iOS Simulator
        script: |
          xcodebuild \
            -project ios/App/App.xcodeproj \
            -scheme App \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath ios/App/build \
            CODE_SIGNING_ALLOWED=NO \
            build
      - name: Zip the simulator app
        script: |
          cd ios/App/build/Build/Products/Debug-iphonesimulator
          zip -r "$CM_BUILD_DIR/NrityaMandala-ios-simulator.zip" App.app
    artifacts:
      - NrityaMandala-ios-simulator.zip
